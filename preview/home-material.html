<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code-Codex Mac · 原生首页与 Portal 材质回归</title><style>
*{box-sizing:border-box}html,body{margin:0;font:13px -apple-system,sans-serif}body{background:#dce6ee;color:#172533}#tools{height:78px;padding:10px;overflow:hidden}button{padding:6px 10px;border:1px solid #778899;border-radius:9px;cursor:pointer}#report{white-space:pre-wrap;font:11px monospace;max-height:180px;overflow:auto}#root{position:relative;height:calc(100vh - 78px);min-height:0;background:var(--color-surface)}.frame{height:100%;display:flex;flex-direction:column}header{height:44px;padding:13px 24px;flex-shrink:0}main{flex:1;min-height:0;padding:38px 24px;background:var(--color-surface);color:var(--color-text)}h1{font-size:25px;margin:0 0 20px}.examples{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.column{min-width:0}.label{margin-bottom:76px}.widget{min-width:0}.home-root{position:relative;--composer-radius:22px;--composer-border-radius:var(--composer-radius);--composer-corner-shape:round;border-radius:0;background:none}.home-body{position:relative;padding:18px 14px;border:1px solid rgba(120,130,150,.35);border-radius:var(--composer-border-radius);corner-shape:var(--composer-corner-shape);background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.home-input{min-height:70px}.home-footer{display:flex;justify-content:space-between;align-items:center;padding-top:10px}.relative{position:relative}.absolute{position:absolute}.inset-x-0{left:0;right:0}.bottom-full{bottom:100%}.rail{position:relative;border-radius:14px;margin:0 14px -26px;padding-bottom:20px}.rail-item{position:relative;padding:8px;border:1px solid rgba(100,110,130,.35);border-radius:14px;min-height:44px;background:var(--color-background-composer-action-bar)}.composer-surface-chrome{box-shadow:var(--elevation-prominent)}.rail:after{content:"";position:absolute;inset:0;border:1px solid rgba(100,110,130,.35);border-radius:inherit;pointer-events:none}.chip{background:rgba(10,16,24,.12);color:inherit;box-shadow:none;font-size:11px}.ProseMirror{outline:none;color:var(--color-text-composer-primary,var(--color-text));caret-color:var(--color-text-composer-primary,var(--color-text))}.native-portal-layer{position:fixed;pointer-events:none;z-index:41}.native-portal-layer [data-floating-chat-surface]{position:relative;height:100%;display:flex;flex-direction:column;min-height:0}.native-portal-layer .composer-inset{margin-top:auto;margin-bottom:45px;pointer-events:auto}.note{position:absolute;bottom:20px;left:24px;color:var(--color-text-secondary);max-width:60%}.test-menu{background:#293544;color:#fff;border-radius:12px;padding:10px}.extra:empty{display:none}
:root{--color-surface:#fff;--color-text:#14202b;--color-text-secondary:#465462;--color-background-composer-surface:rgba(18,23,32,.25);--color-background-composer-action-bar:rgba(18,23,32,.25);--elevation-prominent:0 9px 22px rgba(0,0,0,.28)}:root[data-theme=dark]{--color-surface:#161b23;--color-text:#fff;--color-text-secondary:#bac5d1}
</style><script>
const params=new URLSearchParams(location.search),tone=params.get('theme')==='dark'?'dark':'light';document.documentElement.dataset.theme=tone;
localStorage.setItem('code-codex-mac-backgrounds:v1',JSON.stringify({enabled:!params.has('disabled'),removed:false,layoutVersion:4,materialVersion:1,clarityVersion:2,effect:'blinking-squares',performance:'balanced',composerTransparency:75,transparency:params.has('half-theme')?50:100,backgroundOpacity:100,paused:true,settings:{'blinking-squares':{backgroundColor:'#40576b',opacity:0,mouseInteraction:false,keyboardInteraction:false}}}));
</script><script src="/payload.js"></script></head><body><div id="tools"><button id="resize">新增一行</button> <button id="hide-portal">隐藏／显示 Portal</button> <button id="invalidate">模拟主外壳失效</button> <button id="restore">恢复</button> <span id="status">正在检查三个原生分支</span><details><summary>材质报告</summary><pre id="report"></pre></details></div><div id="root"><div class="frame" data-app-shell-frame="true"><header data-app-shell-titlebar>Code-Codex Mac · 新聊天</header><main class="main-surface" data-app-shell-main-surface="default"><h1>首页输入组件</h1><div class="examples"><section class="column"><p class="label">Root 内绝对 Slot</p><div id="inline-slot"></div></section><section class="column"><p class="label">原生 widget 内兄弟文件栏</p><div id="inline-peer"></div></section><section class="column" id="portal-column"><p class="label">body Portal 内兄弟文件栏</p></section></div><p class="note">Root 原生圆角为 0；圆角来自 Body。独立页面按官方属性、Portal 与负 margin 模拟，不能代替真实 GPT 验收。</p></main></div></div><script>
const nodes=[];
function railMarkup(){return '<div class="rail composer-surface-chrome" data-composer-rail data-composer-rail-placement="above"><div class="rail-item bg-background-composer-action-bar" data-composer-rail-item="present" data-composer-placement="home"><button class="chip">示例项目</button> <button class="chip">此计算机</button><div class="extra"></div></div></div>';}
function rootMarkup(slot){return '<div class="home-root _ComposerLayoutRoot_fixture" role="presentation" data-composer-layout="multiline" data-composer-surface-variant="default" data-composer-surface-overflow="visible" data-composer-utility-bar-variant="home">'+(slot?'<div class="absolute inset-x-0 bottom-full">'+railMarkup()+'</div>':'')+'<div class="relative"><div class="home-body _ComposerLayoutBody_fixture" data-composer-body data-composer-layout="multiline"><div class="home-input _ComposerLayoutInput_fixture" data-composer-input-layout data-composer-layout="multiline"><div class="ProseMirror" data-composer-input contenteditable="true">随心输入</div></div><div class="home-footer _ComposerLayoutFooter_fixture" data-composer-layout="multiline"><span>75% 透明度</span><button class="chip">发送</button></div></div></div></div>';}
function mount(target,name,slot){target.innerHTML=slot?rootMarkup(true):'<div class="widget flex min-w-0 flex-col">'+railMarkup()+rootMarkup(false)+'</div>';nodes.push({name,root:target.querySelector('.home-root'),rail:target.querySelector('[data-composer-rail]'),widget:slot?target.querySelector('.home-root'):target.firstElementChild});}
mount(document.getElementById('inline-slot'),'inline-slot',true);const peer=document.getElementById('inline-peer');mount(peer,'inline-peer',false);peer.firstElementChild.setAttribute('data-codex-composer-root','');peer.firstElementChild.setAttribute('data-composer-placement','home');
const portalMount=document.createElement('div');portalMount.className='contents';portalMount.innerHTML='<div class="native-portal-layer"><section role="region" data-state="open"><div data-floating-chat-surface="true"><div class="relative"><div class="composer-inset"><div class="contents"><div data-right-panel-composer-overlay-content="true"></div></div></div></div></div></section></div>';document.body.append(portalMount);
const layer=portalMount.querySelector('.native-portal-layer'),float=portalMount.querySelector('[data-floating-chat-surface]'),portalContent=portalMount.querySelector('[data-right-panel-composer-overlay-content]');mount(portalContent,'body-portal',false);
function layoutPortal(){const main=document.querySelector('main').getBoundingClientRect(),col=document.getElementById('portal-column').getBoundingClientRect();Object.assign(layer.style,{left:col.left+'px',top:main.top+'px',width:col.width+'px',height:main.height+'px'});portalMount.querySelector('section').style.height='100%';portalMount.querySelector('[data-floating-chat-surface] > .relative').style.height='100%';portalMount.querySelector('[data-floating-chat-surface] > .relative').style.display='flex';portalMount.querySelector('[data-floating-chat-surface] > .relative').style.flexDirection='column';}
layoutPortal();new ResizeObserver(layoutPortal).observe(document.querySelector('main'));window.addEventListener('resize',layoutPortal);
function alpha(value){const m=value.match(/^rgba?\(([^)]+)\)/);return m?(m[1].split(',').length===4?Number(m[1].split(',')[3]):1):0;}
function report(){const results=nodes.map(({name,root,rail,widget})=>{const body=root.querySelector('[data-composer-body]'),item=rail.querySelector('[data-composer-rail-item]'),owner=[root,widget].find(n=>n.hasAttribute('data-cc-mac-home-material-owner')),r=(owner||root).getBoundingClientRect(),b=body.getBoundingClientRect(),f=item.getBoundingClientRect(),pseudo=owner?getComputedStyle(owner,'::before'):null,edges=Object.fromEntries(['top','right','bottom','left'].map(k=>[k,owner?parseFloat(getComputedStyle(owner).getPropertyValue('--cc-home-material-'+k))||0:0])),plate={left:r.left+edges.left,top:r.top+edges.top,right:r.right-edges.right,bottom:r.bottom-edges.bottom};const targets=[{name:'body',x:b.left+5,y:b.top+b.height/2},{name:'file',x:f.left+5,y:f.top+12},{name:'overlap',x:f.left+f.width/2,y:b.top+3}];const candidates=[...new Set([widget,root,root.querySelector('.relative'),body,rail,item])];const points=targets.map(point=>{const paints=candidates.filter(n=>{const r=n.getBoundingClientRect();return point.x>=r.left&&point.x<=r.right&&point.y>=r.top&&point.y<=r.bottom;}).map(n=>({node:n===widget?'widget':n===root?'root':n===body?'body':n===rail?'rail':n===item?'item':'wrapper',alpha:alpha(getComputedStyle(n).backgroundColor)})).filter(p=>p.alpha>0);if(pseudo&&pseudo.content!=='none'&&point.x>=plate.left&&point.x<=plate.right&&point.y>=plate.top&&point.y<=plate.bottom)paints.push({node:'single-plate',alpha:alpha(pseudo.backgroundColor)});return {point:point.name,paints,alpha:Number((1-paints.reduce((left,p)=>left*(1-p.alpha),1)).toFixed(4))};});const shadows=candidates.filter(n=>getComputedStyle(n).boxShadow!=='none').map(n=>({node:n===rail?'rail':'other',shadow:getComputedStyle(n).boxShadow}));return {name,rootInsidePrimary:document.getElementById('root').contains(root),owner:!!owner,portalScope:!!owner?.hasAttribute('data-cc-mac-home-material-surface'),genericOverlay:!!owner?.hasAttribute('data-cc-mac-overlay'),rootRadius:getComputedStyle(root).borderRadius,plateRadius:pseudo?.borderRadius||'none',plateFilter:pseudo?.backdropFilter||'none',points,shadows};});document.getElementById('report').textContent=JSON.stringify({scope:'native-style inline and body Portal structures; independent CSS/geometry, not actual GPT pixels',results},null,2);document.getElementById('status').textContent=results.every(r=>r.owner&&r.points.every(p=>Math.abs(p.alpha-.25)<.003)&&r.plateRadius!=='0px'&&!r.shadows.length&&!r.genericOverlay)?'三个分支均为单层25%底色、圆角，无重复阴影':'材质尚未一致或已被安全撤销';}
document.getElementById('resize').onclick=()=>{for(const e of document.querySelectorAll('.extra'))e.textContent=e.textContent?'':'新增文件示例.txt';setTimeout(report,180);};document.getElementById('hide-portal').onclick=()=>{const off=float.getAttribute('aria-hidden')!=='true';float.setAttribute('aria-hidden',String(off));float.toggleAttribute('inert',off);setTimeout(report,180);};document.getElementById('invalidate').onclick=()=>{document.querySelector('[data-app-shell-frame]').setAttribute('data-app-shell-frame','false');setTimeout(report,180);};document.getElementById('restore').onclick=()=>{window.__CCMacBackground__?.dispose();report();};setTimeout(report,800);
</script></body></html>
