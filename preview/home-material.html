<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code-Codex Mac · 首页文件栏整体材质</title><style>
*{box-sizing:border-box}html,body{margin:0;font:14px -apple-system,sans-serif}body{background:#dce6ee;color:#172533}#tools{padding:12px}button{padding:7px 12px;border:1px solid #778899;border-radius:8px;cursor:pointer}#report{font:11px/1.4 monospace;max-height:200px;overflow:auto;white-space:pre-wrap}#root{position:relative;height:calc(100vh - 78px);min-height:650px;overflow:visible;background:var(--color-surface)}:root{--color-surface:#fff;--color-surface-elevated-secondary:#eff2f5;--color-background-composer-surface:#eff2f5;--color-text:#14202b;--color-text-secondary:#465462;--elevation-prominent:0 9px 22px rgba(0,0,0,.28)}:root[data-theme=dark]{--color-surface:#161b23;--color-surface-elevated-secondary:#303743;--color-background-composer-surface:#303743;--color-text:#fff;--color-text-secondary:#bac5d1}.frame{height:100%;display:flex;flex-direction:column}header{padding:18px}main{flex:1;padding:60px 34px 28px;color:var(--color-text);background:var(--color-surface)}h1{font-size:25px;margin:0 0 70px}.examples{display:grid;grid-template-columns:1fr 1fr;gap:45px;max-width:1200px;margin:auto}.home-root{position:relative;border-radius:24px;margin:45px 0 65px;background:none}.relative{position:relative}.home-body{position:relative;border:1px solid rgba(120,130,150,.35);border-radius:24px;padding:22px 18px;background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.home-input{min-height:78px}.home-footer{display:flex;justify-content:space-between;align-items:center;padding-top:12px}.absolute{position:absolute}.inset-x-0{left:0;right:0}.bottom-full{bottom:100%}.top-full{top:100%}.utility-slot{z-index:0}.rail{position:relative;border-radius:20px}.rail.above{padding-bottom:20px;margin-bottom:-26px}.rail.below{padding-top:20px;margin-top:-26px}.rail-item{min-height:46px;border:1px solid rgba(100,110,130,.35);border-radius:16px;padding:10px 12px;background:var(--color-surface-elevated-secondary)}.composer-surface-chrome{box-shadow:var(--elevation-prominent)}.rail:after{content:"";pointer-events:none;border:1px solid rgba(100,110,130,.35);border-radius:inherit;position:absolute;inset:0}.chip{background:rgba(10,16,24,.15);color:inherit;box-shadow:none}.ProseMirror{outline:none;color:var(--color-text);caret-color:var(--color-text);min-height:62px}.popup{background:#2b3442;color:#fff;padding:12px;margin-top:30px;border-radius:12px}.note{margin:30px auto;max-width:1200px}
</style><script>
const p=new URLSearchParams(location.search),tone=p.get('theme')==='dark'?'dark':'light';document.documentElement.dataset.theme=tone;
localStorage.setItem('code-codex-mac-backgrounds:v1',JSON.stringify({enabled:!p.has('disabled'),removed:false,layoutVersion:4,materialVersion:1,clarityVersion:2,effect:'blinking-squares',performance:'balanced',composerTransparency:75,transparency:100,backgroundOpacity:100,paused:true,settings:{'blinking-squares':{backgroundColor:tone==='light'?'#f4ede4':'#182231',opacity:0,mouseInteraction:false,keyboardInteraction:false}}}));
</script><script src="/payload.js"></script></head><body><div id="tools"><button id="toggle">切换文件栏位置</button> <button id="resize">文件栏增加一行</button> <button id="restore">恢复</button> <span id="status">检查首页Body、文件栏、交叠区域的同一块底板（独立模拟页）</span><details><summary>材质报告</summary><pre id="report"></pre></details></div><div id="root"><div class="frame" data-app-shell-frame="true"><header data-app-shell-titlebar>Code-Codex Mac · 新聊天首页</header><main class="main-surface" data-app-shell-main-surface="default"><h1>你想让我们构建什么？</h1><div class="examples" id="examples"></div><p class="note">左侧上方文件栏，右侧下方文件栏；Absolute Slot 与 Hosted Body 包装模拟原生结构。</p></main></div></div><script>
const examples=document.getElementById('examples');
function create(name,above){const root=document.createElement('div');root.id=name;root.className='home-root _ComposerLayoutRoot_fixture';root.dataset.composerLayout='default';root.dataset.composerSurfaceVariant='default';root.dataset.composerUtilityBarVariant='home';root.innerHTML=`<div class="utility-slot absolute inset-x-0 ${above?'bottom-full':'top-full'}"><div class="rail ${above?'above':'below'} composer-surface-chrome _attached_1hrlq_36" data-composer-rail data-composer-rail-placement="${above?'above':'below'}"><div class="rail-item bg-surface-elevated-secondary" data-composer-rail-item data-composer-placement="home"><button class="chip">示例项目</button> <button class="chip">此计算机</button><div class="extra"></div></div></div></div><div class="relative"><div class="home-body _ComposerLayoutBody_fixture" data-composer-body data-composer-layout="default"><div class="home-input _ComposerLayoutInput_fixture" data-composer-input-layout data-composer-layout="default"><div class="ProseMirror" data-composer-input contenteditable="true">随心输入</div></div><div class="home-footer _ComposerLayoutFooter_fixture" data-composer-layout="default"><span>75% 透明度</span><button class="chip">发送</button></div></div></div>`;return root;}
examples.append(create('above-home',true),create('below-home',false));
function rgbaAlpha(s){const m=s.match(/^rgba?\(([^)]+)\)/);return m?(m[1].split(',').length===4?Number(m[1].split(',')[3]):1):0;}
function inspect(){const results=[];for(const root of examples.children){const rail=root.querySelector('[data-composer-rail]'),item=root.querySelector('[data-composer-rail-item]'),body=root.querySelector('[data-composer-body]'),r=root.getBoundingClientRect(),b=body.getBoundingClientRect(),f=rail.getBoundingClientRect(),pseudo=getComputedStyle(root,'::before');const points=[{name:'body',x:r.left+8,y:b.top+b.height/2},{name:'file',x:r.left+8,y:root.querySelector('.bottom-full')?item.getBoundingClientRect().top+8:item.getBoundingClientRect().bottom-8},{name:'overlap',x:r.left+8,y:root.querySelector('.bottom-full')?b.top+3:b.bottom-3}];const layers=[root,root.querySelector('.relative'),body,rail,item].map(node=>({node,rect:node.getBoundingClientRect(),css:getComputedStyle(node)}));const inset=n=>parseFloat(getComputedStyle(root).getPropertyValue('--cc-home-material-'+n))||0;const plate={left:r.left+inset('left'),top:r.top+inset('top'),right:r.right-inset('right'),bottom:r.bottom-inset('bottom')};const pointResults=points.map(point=>{const colors=layers.filter(l=>point.x>=l.rect.left&&point.x<=l.rect.right&&point.y>=l.rect.top&&point.y<=l.rect.bottom).map(l=>({kind:l.node===body?'body':l.node===rail?'rail':l.node===item?'item':'root',alpha:rgbaAlpha(l.css.backgroundColor)})).filter(l=>l.alpha>0);if(pseudo.content!=='none'&&pseudo.content!=='normal'&&point.x>=plate.left&&point.x<=plate.right&&point.y>=plate.top&&point.y<=plate.bottom){const alpha=rgbaAlpha(pseudo.backgroundColor);if(alpha>0)colors.push({kind:'shared-plate',alpha});}return {...point,layers:colors,alpha:Number((1-colors.reduce((remaining,l)=>remaining*(1-l.alpha),1)).toFixed(4))};});const shadows=layers.filter(l=>l.css.boxShadow!=='none').map(l=>({kind:l.node===rail?'rail':'body',value:l.css.boxShadow}));results.push({id:root.id,owner:root.hasAttribute('data-cc-mac-home-material-owner'),position:rail.dataset.composerRailPlacement,plateCoversRail:plate.top<=f.top+.5&&plate.bottom>=f.bottom-.5,points:pointResults,shadows,railAfterShadow:getComputedStyle(rail,'::after').boxShadow,plateFilter:pseudo.backdropFilter});}return results;}
function report(){const results=inspect();document.getElementById('report').textContent=JSON.stringify({scope:'independent Home absolute rail geometry and CSS, not actual GPT pixels',results},null,2);document.getElementById('status').textContent=results.every(r=>r.points.every(p=>Math.abs(p.alpha-.25)<.003)&&r.shadows.length===0&&r.plateCoversRail)?'Body／文件栏／交叠区均为单层25%底色，无叠层阴影（独立模拟页）':'观察到首页材质不一致（独立模拟页）';}
document.getElementById('toggle').onclick=()=>{for(const root of examples.children){const slot=root.querySelector('.utility-slot'),rail=root.querySelector('[data-composer-rail]'),above=slot.classList.contains('bottom-full');slot.classList.toggle('bottom-full',!above);slot.classList.toggle('top-full',above);rail.classList.toggle('above',!above);rail.classList.toggle('below',above);rail.dataset.composerRailPlacement=above?'below':'above';}setTimeout(report,150);};document.getElementById('resize').onclick=()=>{for(const extra of document.querySelectorAll('.extra'))extra.textContent=extra.textContent?'':'新增文件示例.txt';setTimeout(report,150);};document.getElementById('restore').onclick=()=>{window.__CCMacBackground__?.dispose();report();};setTimeout(report,700);
</script></body></html>
