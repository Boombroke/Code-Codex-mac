<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code-Codex Mac · 主窗口与透明辅助窗口隔离</title><style>
*{box-sizing:border-box}html,body{margin:0;font:14px -apple-system,sans-serif;background:transparent}body{height:100vh;display:flex;flex-direction:column;background:repeating-linear-gradient(135deg,#e4ecf3 0 16px,#b7c8d7 16px 32px);color:#152333}#tools{padding:12px;background:#dce6ee;height:82px;flex-shrink:0}button{padding:7px 12px;border-radius:7px;border:1px solid #8092a0}#status{margin:6px 0}#report{max-height:190px;overflow:auto;white-space:pre-wrap;font:11px monospace}#root{flex:1;position:relative;min-height:0;background:transparent}.frame{height:100%;display:flex;flex-direction:column;background:var(--color-surface)}header{height:40px;padding:12px 24px}main{flex:1;min-height:0;padding:30px;background:var(--color-surface);color:var(--color-text)}.composer{padding:16px;border:1px solid #8899aa;border-radius:18px;margin-top:24px}.ProseMirror{min-height:60px}.floating{position:absolute;inset:40px;pointer-events:none}.controls{padding:20px;background:rgba(13,19,28,.8);color:#fff;border-radius:14px;max-width:500px;margin:30px}
:root{--color-surface:#fff;--color-text:#162735;--color-text-secondary:#475869;--color-background-composer-surface:#eef3f7}
</style><script>
const params=new URLSearchParams(location.search),scene=params.get('scene')||'primary';document.documentElement.dataset.codexWindowType='electron';
localStorage.setItem('code-codex-mac-backgrounds:v1',JSON.stringify({enabled:true,removed:false,layoutVersion:4,materialVersion:1,clarityVersion:2,effect:'black-hole',performance:'balanced',composerTransparency:75,transparency:100,backgroundOpacity:100,settings:{}}));
</script><script src="/payload.js"></script></head><body><div id="tools"><button id="sample">刷新检查</button> <button id="invalidate" hidden>模拟主外壳失效</button> <span id="label"></span><p id="status">等待窗口边界检查</p><details><summary>隔离报告</summary><pre id="report"></pre></details></div><div id="root"></div><script>
let revoked=false;
label.textContent='场景：'+scene+'（同一个源、相同已启用设置；独立模拟）';
if(scene==='primary'||scene==='spoof')root.innerHTML='<div class="frame" data-app-shell-frame="true"><header data-app-shell-titlebar>模拟主聊天外壳</header><main class="main-surface" data-app-shell-main-surface="default"><h1>主窗口可以绘制背景</h1><div class="composer" data-composer-layout="default" data-composer-surface-variant="default"><div class="ProseMirror" data-composer-input>正常输入框</div></div></main></div>';
else if(scene==='bare-main')root.innerHTML='<main class="main-surface" data-app-shell-main-surface="default"><h1>辅助页面仅有main，缺少完整外壳</h1></main>';
else root.innerHTML='<div class="floating"><div class="controls">模拟透明辅助窗口：条纹代表它后面的桌面／其他应用。此页不能被主题铺满。</div></div>';
function report(){const css=getComputedStyle(root);const result={scene,initialRoute:params.get('initialRoute'),adapterLoaded:!!window.__CCMacBackground__,validated:root.hasAttribute('data-cc-mac-validated-surface'),earlyGate:document.documentElement.hasAttribute('data-cc-mac-prepaint'),backgroundNodes:document.querySelectorAll('#cc-mac-background').length,styleNodes:document.querySelectorAll('#cc-mac-prepaint-style,#cc-mac-background-style').length,rootColor:css.backgroundColor,rootImage:css.backgroundImage,scope:'independent auxiliary document isolation; not a physical second monitor test'};document.getElementById('report').textContent=JSON.stringify(result,null,2);document.getElementById('status').textContent=revoked?(result.backgroundNodes===0&&!result.validated&&result.rootImage==='none'?'主窗口资格撤销：背景已停止':'错误：失效界面仍有背景'):scene==='primary'?(result.validated&&result.backgroundNodes===1?'主窗口验证通过：限定在应用外壳内':'主窗口未获准绘制'):(result.backgroundNodes===0&&result.rootImage==='none'?'辅助窗口保持原样：未被背景接入':'错误：辅助窗口被主题改动');}
sample.onclick=report;if(scene==='primary'){invalidate.hidden=false;invalidate.onclick=()=>{revoked=true;root.querySelector('[data-app-shell-frame]').setAttribute('data-app-shell-frame','false');setTimeout(report,150);};}setTimeout(report,600);
</script></body></html>
