<!doctype html><html data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code-Codex Mac · 外壳与单层材质回归</title><style>
*{box-sizing:border-box}body{margin:0;font:14px -apple-system,sans-serif;background:#dce6ee;color:#172533}#tools{padding:12px;min-height:76px}button{cursor:pointer;padding:6px 10px;border:1px solid #8492a0;border-radius:7px}#report{font:11px/1.4 monospace;max-height:220px;overflow:auto;white-space:pre-wrap}#root{position:relative;height:calc(100vh - 76px);min-height:640px;background:var(--color-surface)}:root{--color-surface:#fff;--color-background-primary:#fff;--color-background-secondary:#f3f5f8;--app-color-background-shell:#fff;--color-text:#14202b;--color-text-secondary:#465462;--color-background-composer-surface:#f3f5f8;--color-background-composer-action-bar:#f3f5f8}:root[data-theme=dark]{--color-surface:#161b23;--color-background-primary:#161b23;--color-background-secondary:#20242c;--app-color-background-shell:#161b23;--color-text:#fff;--color-text-secondary:#bac5d1;--color-background-composer-surface:#20242c;--color-background-composer-action-bar:#20242c}.frame{height:100%;display:flex;flex-direction:column;background:var(--color-surface)}header{height:40px;padding:12px 20px;background:var(--color-surface)}.page-stack{display:flex;flex:1;min-height:0}.page{flex:1;min-width:0;display:flex;flex-direction:column}[data-app-shell-active-page=false]{display:none!important}main{flex:1;min-height:0;padding:18px 28px;background:var(--color-surface);color:var(--color-text)}._FullHeightPageSurfaceLayout_fixture{padding:10px;background:var(--app-color-background-shell);transition:background-color .16s linear}.messaging-root,.thread-pane{background:var(--color-background-primary)}.native-local-surface{--color-background-primary:var(--color-background-secondary)}[data-app-shell-workspace-row]{position:relative;isolation:isolate;min-height:34px;padding:8px 12px;--color-surface-secondary:rgba(255,255,255,.5)}[data-theme=dark] [data-app-shell-workspace-row]{--color-surface-secondary:rgba(0,0,0,.5)}[data-codex-window-type=browser] [data-app-shell-workspace-row]::before{position:absolute;inset:0;z-index:-1;content:"";background:var(--color-surface-secondary)}h1{margin:6px 0 16px;font-size:24px}.composers{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:1050px;margin:20px auto}.composer-root{border:1px solid #8994a060;border-radius:16px;overflow:hidden;padding:0;background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.composer-body{padding:16px;min-height:120px;background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.composer-input{background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.ProseMirror{min-height:54px;padding:8px;outline:none;background:var(--color-background-composer-surface);color:var(--color-text)}.composer-footer{padding:12px;background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.bg-background-composer-action-bar{padding:10px;background:var(--color-background-composer-action-bar)}.reply-context{padding:10px 16px;background:var(--composer-layout-surface-background,var(--color-background-composer-surface))}.selected-control{background:#7344dd;color:white;border:none}.isolated-rail{max-width:1050px;margin:10px auto;border:1px solid #8994a060;border-radius:12px}.tooltip{padding:12px;background:#293544;color:white;border-radius:8px}.loading-shell{position:absolute;inset:40px 0 0;display:grid;place-items:center;color:var(--color-text)}
</style><script>
const params=new URLSearchParams(location.search),nativeTheme=params.get('theme')==='dark'?'dark':'light',enabled=!params.has('disabled'),removed=params.has('removed');document.documentElement.dataset.theme=nativeTheme;document.documentElement.dataset.codexWindowType=params.get('window')==='browser'?'browser':'electron';
localStorage.setItem('code-codex-mac-backgrounds:v1',JSON.stringify({enabled,removed,layoutVersion:4,materialVersion:1,clarityVersion:2,effect:'black-hole',transparency:100,backgroundOpacity:100,composerTransparency:75,codeTransparency:60,performance:'balanced',tone:'auto',settings:{}}));
</script><script src="/payload.js"></script></head><body><div id="tools"><button id="repeat">重复切换</button> <button id="restore">恢复</button> <span id="status">按真实嵌套结构检查外壳、伪元素和输入区；独立模拟页。</span><details><summary>回归报告</summary><pre id="report"></pre></details></div><div id="mount"></div><script>
(()=>{
let stage='initial',phase='running',frames=0,opaqueShellFrames=0,materialMismatchFrames=0,runs=[],previous='',errors=[],epoch=performance.now(),timers=[],raf;
const alpha=s=>{if(s==='transparent')return 0;const m=s.match(/^rgba?\(([^)]+)\)/);return m?(m[1].split(',').length===4?Number(m[1].split(',')[3]):1):0;};
function stack(node,root){let layers=[],a=0,filters=0;for(let n=node;n&&n!==root;n=n.parentElement){const c=getComputedStyle(n),value=alpha(c.backgroundColor);if(value>0){layers.push({id:n.id,color:c.backgroundColor,alpha:value});a=1-(1-a)*(1-value);}if(c.backdropFilter!=='none')filters++;}return {alpha:Math.round(a*10000)/10000,layers,filters};}
function composer(name,home){return `<div id="${name}-root" class="composer-root _ComposerLayoutRoot_fixture" data-composer-surface-variant="default" data-composer-layout="default" ${home?'data-composer-utility-bar-variant="home"':''}><div id="${name}-reply" class="reply-context _ComposerLayoutReplyContext_fixture" data-composer-layout="default">引用上下文</div><div id="${name}-body" class="composer-body _ComposerLayoutBody_fixture" data-composer-body data-composer-layout="default"><div id="${name}-input" class="composer-input _ComposerLayoutInput_fixture" data-composer-input-layout data-composer-layout="default"><div id="${name}-editor" class="ProseMirror" data-composer-input role="textbox" contenteditable="true">${home?'首页':'聊天'}输入框：75%透明度</div></div></div><div id="${name}-footer" class="composer-footer _ComposerLayoutFooter_fixture" data-composer-layout="default"><div id="${name}-action" class="bg-background-composer-action-bar"><button class="selected-control" aria-selected="true">选中按钮保留颜色</button></div></div></div>`;}
function page(name){const p=document.createElement('section');p.className='page';p.dataset.appShellActivePage='true';p.dataset.appShellPageSurface='true';p.innerHTML=`<main class="main-surface" data-app-shell-main-surface="default"><div id="native-shell" class="_FullHeightPageSurfaceLayout_fixture bg-background-surface"><div id="workspace-row" data-app-shell-workspace-row>真实 workspace-row 伪元素背景</div><div class="messaging-root"><div id="local-pane" class="thread-pane native-local-surface"><h1>路由：${name}</h1><p>背景持续透明，输入框不重复叠加底色。</p></div></div></div><div class="composers">${composer('thread',false)}${composer('home',true)}</div><div id="rail-outer" class="bg-background-composer-action-bar isolated-rail"><div id="rail-inner" class="bg-background-composer-action-bar">独立项目工具条：单层底色</div></div><div class="tooltip" role="tooltip"><div data-composer-body>弹窗原有材质</div></div></main>`;return p;}
function app(){const r=document.createElement('div');r.id='root';r.innerHTML='<div class="frame" data-app-shell-frame="true"><header data-app-shell-titlebar>Code-Codex Mac · 外壳与单层输入材质</header><div class="page-stack"></div></div>';r.querySelector('.page-stack').append(page('初始'));return r;}
function observe(time){if(phase==='complete')return;frames++;const root=document.getElementById('root'),nodes=[];if(root){for(const n of root.querySelectorAll('#native-shell,#local-pane,.loading-shell'))if(!n.closest('[data-app-shell-active-page=false]')){const s=getComputedStyle(n);nodes.push({id:n.id,color:s.backgroundColor,alpha:alpha(s.backgroundColor),before:alpha(getComputedStyle(n,'::before').backgroundColor)});}const row=root.querySelector('#workspace-row');if(row&&!row.closest('[data-app-shell-active-page=false]'))nodes.push({id:'workspace-row',alpha:alpha(getComputedStyle(row).backgroundColor),before:alpha(getComputedStyle(row,'::before').backgroundColor)});}
const materials={};if(root)for(const [id,want]of [['thread-editor',.25],['thread-action',.25],['home-editor',.25],['home-action',.25],['rail-inner',.25]]){const node=[...root.querySelectorAll('#'+id)].find(n=>!n.closest('[data-app-shell-active-page=false]')); if(node&&!node.closest('[data-app-shell-active-page=false]'))materials[id]={want,...stack(node,node.closest('.composer-root')?.parentElement||node.closest('main'))};}
const requested=enabled&&!removed;if(requested&&nodes.some(n=>n.alpha>0.001||n.before>0.001))opaqueShellFrames++;if(requested&&Object.values(materials).some(m=>Math.abs(m.alpha-m.want)>.002||m.filters>1))materialMismatchFrames++;
const state={stage,nodes,materials,backgroundPresent:!!root?.querySelector('#cc-mac-background'),mounts:Number(root?.querySelector('#cc-mac-background')?.dataset.rendererMounts||0)},key=JSON.stringify(state);if(key===previous)runs.at(-1).frames++;else{runs.push({atMs:Math.round(time-epoch),frames:1,...state});previous=key;}raf=requestAnimationFrame(observe);}
function schedule(fn,ms){timers.push(setTimeout(fn,ms));}
function start(){timers.forEach(clearTimeout);phase='running';stage='initial';frames=opaqueShellFrames=materialMismatchFrames=0;runs=[];previous='';epoch=performance.now();document.getElementById('mount').replaceChildren(app());schedule(()=>{stage='overlap';const root=document.getElementById('root'),old=root.querySelector('.page');root.querySelector('.page-stack').append(page('新标签'));schedule(()=>{old.dataset.appShellActivePage='false';stage='switch';},120);},450);schedule(()=>{stage='loading';const root=document.getElementById('root');root.querySelector('.page-stack').replaceChildren();const loader=document.createElement('div');loader.className='_FullHeightPageSurfaceLayout_fixture bg-background-surface loading-shell';loader.textContent='加载新聊天…';root.append(loader);schedule(()=>{stage='loaded';loader.remove();root.querySelector('.page-stack').append(page('加载完成'));},850);},1000);schedule(()=>{stage='children-replaced';const root=document.getElementById('root'),replacement=app();root.replaceChildren(...replacement.childNodes);},2050);schedule(()=>{stage='root-replaced';document.getElementById('mount').replaceChildren(app());},2600);schedule(()=>{phase='complete';cancelAnimationFrame(raf);document.getElementById('report').dataset.phase='complete';document.getElementById('report').textContent=JSON.stringify({scope:'independent CSS/ancestor/pseudo observation, not actual GPT pixels',theme:nativeTheme,enabled,removed,frames,opaqueShellFrames,materialMismatchFrames,errors,runs},null,2);document.getElementById('status').textContent=`外壳不透明样本：${opaqueShellFrames}；输入区叠层异常：${materialMismatchFrames}（独立模拟页）`;},3800);raf=requestAnimationFrame(observe);}
window.addEventListener('error',e=>errors.push(e.message));window.addEventListener('unhandledrejection',e=>errors.push(String(e.reason)));document.getElementById('repeat').onclick=start;document.getElementById('restore').onclick=()=>window.__CCMacBackground__?.dispose();start();
})();
</script></body></html>
